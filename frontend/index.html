<!doctype html>
<html lang="es-CU" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#22a06b" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12161d" media="(prefers-color-scheme: dark)" />

    <title>Base de Batos | Gestión de planes de entrenamiento</title>
    <meta
      name="description"
      content="Sistema web para la gestión y generación automática de planes de entrenamiento enitorios: ejercicios, rutinas, sesiones y reportes de progreso."
    />

    <!--
      Se aplica el tema antes de la hidratación para evitar el parpadeo blanco
      cuando el usuario ha elegido el modo oscuro.
    -->
    <script>
      ;(function () {
        try {
          var storage = window.localStorage.getItem('bb2:theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = storage && storage !== 'system' ? storage : prefersDark ? 'dark' : 'light'
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.style.colorScheme = theme
        } catch (error) {
          // El acceso al almacenamiento puede estar bloqueado: se usa el tema del sistema.
        }
      })()
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
