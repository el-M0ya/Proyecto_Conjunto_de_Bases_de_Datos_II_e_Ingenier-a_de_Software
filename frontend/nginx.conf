# Configuración de Nginx para publicar la aplicación web.
#
# Como la aplicación usa enrutamiento del lado del cliente, toda ruta desconocida
# debe devolver el documento de entrada: de lo contrario, al recargar una ruta
# profunda (por ejemplo, /panel/rutinas/42) el servidor respondería 404.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad básicas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión del texto transferred.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss image/svg+xml;

    # El service worker de MSW debe servirse desde la raíz para que su ámbito
    # cubra toda la aplicación.
    location = /mockServiceWorker.js {
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # Los recursos con hash en el nombre se pueden cachear indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Enrutamiento del lado del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
