name: Frontend

# El objetivo de este flujo es comprobar, en cada integración, que el frontend
# mantiene sus tres garantías: tipos correctos, estilo conforme a las reglas del
# proyecto y pruebas en verde con cobertura suficiente.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

# Cancela ejecuciones anteriores del mismo commit cuando llega uno nuevo.
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tipos, estilo y pruebas
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar el formateo
        run: npm run format:check

      - name: Comprobar los tipos
        run: npm run typecheck

      - name: Analizar el código
        run: npm run lint

      - name: Ejecutar las pruebas
        run: npm test

      - name: Publicar el informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: frontend/coverage
          retention-days: 7

  build:
    name: Compilación de producción
    runs-on: ubuntu-latest
    needs: quality

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      - name: Construir la imagen de contenedor
        run: docker build -t basedebatos-frontend:ci .

  image:
    name: Imagen del frontend
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Autenticar en el registro
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
