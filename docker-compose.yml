# Orquestación de los servicios del proyecto.
#
# Cada servicio es independiente y se levanta por separado mientras el equipo
# trabaja por functionalities. `docker compose up` sin argumentos levanta
# únicamente la base de datos, que es lo habitual durante el desarrollo.

services:
  # ---------------------------------------------------------------------------
  # Base de datos
  # ---------------------------------------------------------------------------
  # El motor concreto se confirmará al cerrar el diseño del MERX (semana 5).
  # PostgreSQL es la opción de referencia para el modelo relacional.
  postgres:
    image: postgres:17-alpine
    container_name: basedebatos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-basedebatos}
      POSTGRES_USER: ${POSTGRES_USER:-basedebatos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-basedebatos}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Los scripts de inicialización se ejecutan sólo en el primer arranque,
      # cuando el volumen está vacío.
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-basedebatos}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Caché de la rutina activa
  # ---------------------------------------------------------------------------
  # El enunciado exige que la rutina activa del cliente esté disponible de
  # forma prácticamente inmediata, con independencia del número de usuarios
  # conectados simultáneamente. Redis absorbe esa carga de lecturas.
  redis:
    image: redis:8-alpine
    container_name: basedebatos-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Almacén documental de la estructura de las rutinas
  # ---------------------------------------------------------------------------
  # El enunciado establece que la estructura de bloques de cada rutina es de
  # esquema variable y no debe modelarse junto al resto de tablas. MongoDB la
  # conserva como documento con su propia forma, sin forzar un esquema común.
  mongo:
    image: mongo:8
    container_name: basedebatos-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-basedebatos}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-basedebatos}
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------
  # Perfil `full`: publica la aplicación ya compilada en Nginx.
  #   docker compose --profile full up --build
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_ENV: production
        VITE_API_BASE_URL: /api
        VITE_ENABLE_MOCKS: 'false'
    container_name: basedebatos-frontend
    restart: unless-stopped
    profiles: ['full']
    ports:
      - '${FRONTEND_PORT:-8080}:80'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  mongo-data:
